name: Bug report
description: Something in @ackplus/nest-crud (or a client builder) behaves incorrectly
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Please check the CHANGELOG first — it may already be fixed in a newer version. Do not include secrets or customer data.
  - type: dropdown
    id: package
    attributes:
      label: Package
      options:
        - "@ackplus/nest-crud"
        - "@ackplus/nest-crud-request"
        - nest_crud_request (Dart)
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Package version
      placeholder: "2.3.0  (npm ls @ackplus/nest-crud)"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: NestJS, TypeORM and database versions
      placeholder: "NestJS 11.1, TypeORM 0.3.28, Postgres 16"
    validations:
      required: true
  - type: textarea
    id: setup
    attributes:
      label: Entity, @Crud() options and any hooks involved
      render: ts
    validations:
      required: true
  - type: textarea
    id: request
    attributes:
      label: Exact request (method, URL, body) or service call
      render: bash
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
      description: Response body, status code, error or SQL if you have it
    validations:
      required: true
  - type: textarea
    id: workaround
    attributes:
      label: Workaround in use (optional)
